name: Build and Release

on:
  push:
    tags:
      - 'v*' # v1.0.0과 같이 v로 시작하는 태그를 푸시할 때만 실행

jobs:
  release:
    runs-on: windows-latest

    permissions:
      contents: write # GitHub Releases에 파일을 업로드하기 위한 권한

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 패키지 설치
        run: npm install

      - name: 윈도우 앱 빌드 및 배포
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:win -- -p always
